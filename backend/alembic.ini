; Alembic config for Sentido backend.
; The database URL is loaded at runtime from settings (env vars), not from
; this file — env.py reads it from sentido.shared.config.get_settings().

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

; Filename template includes a timestamp so revision files sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
