[project]
name = "sentido"
version = "0.1.0"
description = "Sentido — semantic book catalog backend (PT-BR synopses + embedding search)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "Sentido team" }]

# Runtime dependencies — restricted to the stack declared in
# docs/instructions/backend-implementation-plan.md §2.
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "pgvector>=0.3,<0.4",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<0.28",
  "structlog>=24.1,<25.0",
  "openai>=1.30,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<0.24",
  "pip-tools>=7.4,<8.0",
  "ruff>=0.5,<0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "tests"]
