# Local-dev docker-compose for the Sentido backend services.
#
# Scope: db + migrate + api. The frontend ships via Vercel (PRD §7.2) and
# is not containerized here — run `npm run dev` from `frontend/` separately.
#
# First boot:
#
#     cp backend/.env.example backend/.env
#     # edit backend/.env, fill in OPENAI_API_KEY and ADMIN_TOKEN
#     docker compose up -d
#
# That's it. The `migrate` one-shot runs `alembic upgrade head` before
# `api` starts, so no manual migration step is needed.
#
# Postgres uses the pgvector/pgvector:pg16 image which bundles the
# `vector` extension; `pgcrypto` ships with Postgres core.
#
# Host port 5433 is used for Postgres (instead of 5432) to avoid
# colliding with a developer's locally-installed Postgres. The API is
# exposed on host port 8000.

# ─────────────────────────────────────────────────────────────────────────────
# Shared anchors — the api and migrate services build the same image and
# read the same env, with one difference: DATABASE_URL is set here in
# `environment:` (with the in-compose hostname `db:5432`) so it overrides
# whatever the user has in their .env. That way users running alembic
# OUTSIDE compose can keep `localhost:5433` in their .env without breaking
# the in-compose path.
# ─────────────────────────────────────────────────────────────────────────────

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: docker/Dockerfile

x-backend-env: &backend-env
  env_file:
    - ./backend/.env
  environment:
    # In-container DB URL — service-name DNS, internal port. Overrides
    # whatever DATABASE_URL the user has set in backend/.env.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentido}:${POSTGRES_PASSWORD:-sentido}@db:5432/${POSTGRES_DB:-sentido}
    PYTHONPATH: /app/src

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sentido_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentido}
      POSTGRES_DB: ${POSTGRES_DB:-sentido}
    ports:
      - "5433:5432"
    volumes:
      - sentido_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentido} -d ${POSTGRES_DB:-sentido}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: runs `alembic upgrade head` to the latest revision, then
  # exits 0. The api service depends on this completing successfully.
  migrate:
    <<: [*backend-build, *backend-env]
    container_name: sentido_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/alembic:/app/alembic
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: [*backend-build, *backend-env]
    container_name: sentido_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Hot-reload: bind-mount source + alembic so edits on the host
      # take effect without a rebuild. Read-write is fine for dev.
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    command:
      [
        "uvicorn",
        "sentido.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    restart: unless-stopped

volumes:
  sentido_pgdata:
    name: sentido_pgdata
